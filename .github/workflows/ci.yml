name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Frontend check
        run: bun run check
      - name: Frontend build
        run: bun run build
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Rust test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout pinned synthetic Core fixtures
        uses: actions/checkout@v5
        with:
          repository: RageLab/ragelab
          ref: cba6fd257526ceaa412c6b4bfacc6f3c2da314eb
          path: core-fixtures
          sparse-checkout: fixtures/synthetic
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Standalone release build and native smoke without installer
        shell: pwsh
        run: >
          bun run release:smoke --
          -FixtureRoot "$PWD\core-fixtures\fixtures\synthetic"
          -Output "$PWD\release-smoke-report.json"
          -BudgetMs 120000
      - name: Upload release smoke report
        uses: actions/upload-artifact@v4
        with:
          name: ragelab-studio-release-smoke
          path: release-smoke-report.json
