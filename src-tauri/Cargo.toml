[package]
name = "ragelab-studio"
version = "0.1.0"
description = "Desktop visual interface for RageLab"
authors = ["RageLab contributors"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"

[lib]
name = "ragelab_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ragelab-engine = { git = "https://github.com/RageLab/ragelab.git", rev = "cba6fd257526ceaa412c6b4bfacc6f3c2da314eb" }
ragelab-render = { git = "https://github.com/RageLab/ragelab.git", rev = "cba6fd257526ceaa412c6b4bfacc6f3c2da314eb" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
